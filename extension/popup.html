<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ProfX</title>
  <style>
    :root { color-scheme: light; }
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font: 400 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2330;
      background: #fff;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #4f46e5;
    }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 9px;
      border: 1px solid #d7dae3;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 2px solid #4f46e5; outline-offset: -1px; border-color: #4f46e5; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      font: 600 13px/1 inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #4338ca; }
    button:disabled { background: #a5a9bd; cursor: progress; }
    button.secondary { background: #eef0f6; color: #3a3f52; }
    button.secondary:hover:not(:disabled) { background: #e3e6ef; }
    .msg { margin-top: 12px; min-height: 18px; overflow-wrap: anywhere; }
    .msg.error { color: #b91c1c; }
    .msg.ok { color: #15803d; }
    .stats {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eceef4;
      color: #585e73;
      font-size: 12px;
    }
    .stats div { display: flex; justify-content: space-between; padding: 2px 0; }
    .stats b { color: #1f2330; font-variant-numeric: tabular-nums; }
    .who { font-size: 12px; color: #585e73; margin-bottom: 4px; overflow-wrap: anywhere; }
    .hint { margin-top: 12px; font-size: 11.5px; color: #767c91; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>ProfX</h1>

  <section id="signed-out">
    <label for="apiUrl">ProfX address</label>
    <input id="apiUrl" type="url" placeholder="https://your-api.up.railway.app/api" autocomplete="off">

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="login" type="button">Sign in</button>
  </section>

  <section id="signed-in" class="hidden">
    <div class="who">Signed in as <b id="who"></b></div>
    <div class="stats" id="stats"></div>
    <button id="refresh" class="secondary" type="button">Refresh</button>
    <button id="logout" class="secondary" type="button">Sign out</button>
    <p class="hint">
      Open <b>Orders → Ready to Ship</b> in the Meesho supplier panel, then press
      <b>Save product images</b> on the panel at the bottom-right of that page.
    </p>
  </section>

  <div class="msg" id="msg"></div>

  <script src="popup.js"></script>
</body>
</html>
