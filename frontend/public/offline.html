<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ProfX — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0B3F86 0%, #1E90E8 55%, #12C79A 100%);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff; text-align: center; padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      max-width: 340px; width: 100%;
      background: rgba(255,255,255,0.10); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 24px; padding: 40px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .icon { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.01em; }
    p { font-size: 15px; line-height: 1.5; opacity: 0.85; margin-bottom: 24px; }
    button {
      font-family: inherit; font-size: 15px; font-weight: 600; color: #0B3F86;
      background: #fff; border: 0; border-radius: 14px; padding: 13px 28px;
      cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icons/icon-192.png" alt="ProfX" />
    <h1>You're offline</h1>
    <p>ProfX needs a connection to fetch your latest orders and profit. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
